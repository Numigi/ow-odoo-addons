version: '2'
services:
  db:
    image: postgres:13
    platform: linux/amd64
    environment:
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_USER=odoo
      - POSTGRES_DB=postgres
    restart: unless-stopped
    volumes:
      - ./postgresql:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  odoo:
    image: odoo:14
    platform: linux/amd64
    depends_on:
      - db
    ports:
      - "8069:8069"
      - "8072:8072"
    tty: true
    command: --log-level=info --no-xmlrpc
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    volumes:
      - .:/mnt/extra-addons
      - odoo-data:/var/lib/odoo
    restart: unless-stopped

volumes:
  odoo-data:
